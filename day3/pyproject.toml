[project]
name = "aaasec2-day3"
version = "0.1.0"
description = "Day 3 — agents as networked software: Deep Agents, Skills, FastAPI, Docker, MCP, A2A"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7,<0.8",
    "langchain-openai>=0.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "fastmcp>=3.4,<4",        # stable v3 line; the v4 beta demo in 08-*.md runs isolated via uv --with
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
]

# NOTE: no Jupyter today. Day 3 is files, processes, ports, and containers —
# a notebook would hide exactly the things we're teaching.
